<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes fichiers</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#d9861c">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<link rel="stylesheet" href="css/studio.css">
<style>
  body { min-height: 100%; }
  .topbar .logo { background: #37474f !important; color: #fff !important; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 14px 16px 80px; display: grid; gap: 14px; }
  .search { display: flex; gap: 8px; }
  .search input { flex: 1; font-size: 17px; padding: 12px 14px; border-radius: 12px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips button { border-radius: 999px; padding: 5px 12px; font-size: 13px; }
  .chips button.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .shared { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
  .shared h2 { margin: 0; font-size: 16px; }
  .sf { display: grid; grid-template-columns: 1fr; gap: 6px; background: var(--panel); border-radius: 10px; padding: 10px; }
  .sf .apps { display: flex; gap: 6px; flex-wrap: wrap; }
  .items { display: grid; gap: 6px; }
  .it { display: grid; grid-template-columns: 42px 1fr auto; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; text-align: left; width: 100%; color: var(--fg); font: inherit; }
  .it:hover { border-color: var(--accent); }
  .it .ic { width: 42px; height: 42px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px; }
  .it .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .it .s { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .it .sn { font-size: 13px; color: var(--muted); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .it mark { background: #ffe58a; color: #000; border-radius: 2px; }
  .it .d { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .it > div { min-width: 0; }
  h3 { margin: 6px 0 0; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .store { font-size: 13px; color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .store .bar { flex: 1; min-width: 120px; height: 8px; background: var(--panel-2); border-radius: 4px; overflow: hidden; } .store .bar div { height: 100%; background: var(--accent); }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }
</style>
</head>
<body>
<div class="topbar">
  <a class="brand" href="index.html"><span class="logo">Fi</span><span>Mes fichiers</span></a>
  <span class="spacer"></span>
  <button id="themeBtn" class="ghost" title="Basculer thème clair/sombre">Thème</button>
</div>
<div class="wrap">
  <div class="search"><input type="search" id="q" placeholder="Rechercher dans tous vos documents, notes, bases, agendas…" aria-label="Rechercher partout" autofocus><button class="primary" id="openFile" title="Ouvrir un fichier du téléphone ou de l'ordinateur">📂 Ouvrir</button></div>
  <div id="shared"></div>
  <div class="chips" id="chips"></div>
  <div id="list" class="items"><p class="empty">Chargement…</p></div>
  <div class="store" id="store"></div>
</div>
<div id="toast" hidden></div>
<script src="js/common.js"></script>
<script src="js/files-app.js"></script>
</body>
</html>
