<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notes Joe</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#d9861c">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<link rel="stylesheet" href="css/studio.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  .nt-app { display: grid; grid-template-rows: auto 1fr; height: 100%; height: 100dvh; }
  .topbar .logo { background: #c8901a !important; color: #fff !important; }
  .panes { display: grid; grid-template-columns: 220px 320px 1fr; min-height: 0; }
  .nav, .list, .ed { min-height: 0; overflow: hidden; display: grid; }
  .nav { background: var(--panel); border-right: 1px solid var(--line); grid-template-rows: 1fr; }
  .nav .scroll { overflow-y: auto; padding: 10px 8px 20px; display: grid; align-content: start; gap: 2px; }
  .nav h4 { margin: 14px 8px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  .nav h4 button { padding: 0 6px; font-size: 14px; min-width: 0; }
  .nav .it { display: flex; gap: 8px; align-items: center; padding: 7px 10px; border-radius: 8px; cursor: pointer; border: 0; background: transparent; width: 100%; text-align: left; font-size: 14px; color: var(--fg); }
  .nav .it:hover { background: var(--panel-2); }
  .nav .it.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav .it .n { margin-left: auto; font-size: 12px; color: var(--muted); }
  .nav .it .dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .list { background: var(--panel-2); border-right: 1px solid var(--line); grid-template-rows: auto auto 1fr; }
  .list .head { display: flex; gap: 6px; padding: 10px; align-items: center; }
  .list .head input { flex: 1; }
  .list .sub { display: flex; gap: 6px; padding: 0 10px 8px; align-items: center; font-size: 12px; color: var(--muted); }
  .list .sub select { width: auto; padding: 2px 6px; font-size: 12px; margin-left: auto; }
  .cards { overflow-y: auto; padding: 0 10px 80px; display: grid; gap: 8px; align-content: start; }
  .card { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; }
  .card.on { outline: 2px solid var(--accent); outline-offset: -1px; }
  .card h3 { margin: 0; font-size: 15px; display: flex; gap: 6px; align-items: center; min-width: 0; }
  .card h3 span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card p { margin: 0; font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; grid-column: 1; }
  .card .meta { grid-column: 1; font-size: 11px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
  .card .meta .tag { background: var(--panel-2); border-radius: 4px; padding: 0 5px; }
  .card img.th { grid-column: 2; grid-row: 1 / span 3; width: 56px; height: 56px; object-fit: cover; border-radius: 6px; }
  .card mark { background: #ffe58a; color: #000; border-radius: 2px; }
  .empty-list { text-align: center; color: var(--muted); padding: 30px 10px; font-size: 14px; }
  .ed { background: var(--panel); grid-template-rows: auto auto auto 1fr auto; }
  .ed .bar1 { display: flex; gap: 6px; padding: 8px 12px; align-items: center; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .ed .bar1 select { width: auto; max-width: 170px; padding: 4px 6px; }
  .ed .bar1 .sp { flex: 1; }
  .ed .bar1 button.on { color: var(--accent); border-color: var(--accent); }
  .ed .ttl { border: 0; font: 600 22px var(--font-ui); padding: 12px 16px 2px; background: transparent; color: var(--fg); outline: none; width: 100%; }
  .ed .tagsrow { padding: 0 16px 6px; display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
  .ed .tagsrow input { border: 0; background: transparent; padding: 2px 0; flex: 1; font-size: 13px; color: var(--fg); outline: none; }
  .ed .tb { position: sticky; top: 0; z-index: 2; display: flex; gap: 3px; padding: 6px 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); overflow-x: auto; background: var(--panel-2); }
  .ed .tb button { padding: 4px 8px; min-width: 32px; justify-content: center; flex: none; }
  .ed .tb button.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .ed .tb .sep { width: 1px; background: var(--line); margin: 2px 3px; flex: none; }
  .ed .scroll { overflow-y: auto; min-height: 0; }
  .body { outline: none; padding: 14px 16px 120px; font: 16px/1.55 var(--font-ui); color: var(--fg); min-height: 60%; overflow-wrap: break-word; }
  .body:empty::before { content: attr(data-ph); color: var(--muted); }
  .body h2 { font-size: 19px; margin: 14px 0 6px; } .body h3 { font-size: 16px; margin: 12px 0 4px; }
  .body p, .body div { margin: 0 0 6px; }
  .body img { max-width: 100%; height: auto; border-radius: 8px; display: block; margin: 8px 0; }
  .body hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
  .body mark { background: #ffe58a; color: #000; }
  .body ul.chk { list-style: none; padding-left: 4px; }
  .body ul.chk li { position: relative; padding-left: 30px; margin: 4px 0; }
  .body ul.chk li::before { content: ''; position: absolute; left: 2px; top: 3px; width: 18px; height: 18px; border: 2px solid var(--muted); border-radius: 5px; box-sizing: border-box; cursor: pointer; }
  .body ul.chk li[data-done="1"] { color: var(--muted); text-decoration: line-through; }
  .body ul.chk li[data-done="1"]::before { background: var(--accent); border-color: var(--accent); }
  .body ul.chk li[data-done="1"]::after { content: ''; position: absolute; left: 8px; top: 6px; width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .body .memo { display: flex; gap: 8px; align-items: center; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; margin: 8px 0; user-select: none; }
  .body .memo audio { height: 36px; flex: 1; min-width: 0; }
  .body .memo span { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .ed .foot { padding: 4px 16px calc(4px + env(safe-area-inset-bottom, 0px)); font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); display: flex; gap: 10px; }
  .ed .none { display: grid; place-items: center; color: var(--muted); text-align: center; padding: 20px; }
  .recbar { display: flex; gap: 10px; align-items: center; padding: 6px 16px; background: #fdecea; color: #b71c1c; font-weight: 600; }
  .recbar .dot { width: 10px; height: 10px; border-radius: 50%; background: #c62828; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .fab { display: none; }
  .back { display: none !important; }
  .swatches { display: flex; gap: 6px; }
  .swatches button { width: 24px; height: 24px; min-width: 0; padding: 0; border-radius: 50%; }
  .swatches button.on { outline: 2px solid var(--fg); outline-offset: 2px; }
  @media (max-width: 860px) {
    .panes { grid-template-columns: 1fr; }
    .panes > * { display: none !important; }
    .panes[data-view="nav"] .nav, .panes[data-view="list"] .list, .panes[data-view="note"] .ed { display: grid !important; }
    .back { display: inline-flex !important; }
    .fab { display: grid; place-items: center; position: fixed; right: 18px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; border-radius: 50%; font-size: 30px; z-index: 30; box-shadow: var(--shadow); padding: 0; }
    .panes[data-view="note"] ~ .fab { display: none; }
    .topbar .brand span:last-child { display: none; }
    .body { font-size: 17px; }
  }
</style>
</head>
<body>
<div class="nt-app">
  <div class="topbar">
    <a class="brand" href="index.html"><span class="logo">No</span><span>Notes Joe</span></a>
    <button id="navBtn" class="back" title="Carnets">☰ Carnets</button>
    <span class="spacer"></span>
    <button id="importBtn" title="Importer des fichiers .txt ou .md comme notes">Importer…</button>
    <button id="themeBtn" class="ghost" title="Basculer thème clair/sombre">Thème</button>
  </div>
  <div class="panes" id="panes" data-view="list">
    <aside class="nav"><div class="scroll" id="nav"></div></aside>
    <section class="list">
      <div class="head"><input type="search" id="q" placeholder="Rechercher dans les notes…" aria-label="Rechercher"><button class="primary" id="newBtn" title="Nouvelle note (Ctrl+Alt+N)">＋</button></div>
      <div class="sub"><span id="listTitle">Toutes les notes</span><select id="sort" aria-label="Trier"><option value="upd">Modifiées récemment</option><option value="cre">Créées récemment</option><option value="title">Titre A → Z</option></select></div>
      <div class="cards" id="cards"></div>
    </section>
    <section class="ed" id="ed"></section>
  </div>
  <button class="fab primary" id="fab" title="Nouvelle note">＋</button>
</div>
<div id="toast" hidden></div>
<script src="js/common.js"></script>
<script src="js/speech.js"></script>
<script src="js/tts.js"></script>
<script src="js/notes-app.js"></script>
</body>
</html>
