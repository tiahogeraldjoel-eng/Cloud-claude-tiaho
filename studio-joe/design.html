<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Design Joe</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#d9861c">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<link rel="stylesheet" href="css/studio.css">
<style>
  .stage { display: grid; place-items: center; padding: 40px; }
  #board { display: block; touch-action: none; box-shadow: var(--shadow); background: #fff; overflow: visible; }
  .objlist { display: grid; gap: 2px; max-height: 220px; overflow-y: auto; }
  .objlist button { justify-content: flex-start; background: transparent; border-color: transparent; font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
  .objlist button.active { background: var(--accent-soft); border-color: var(--accent); }
  .templates { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .templates button { flex-direction: column; align-items: stretch; padding: 8px; gap: 6px; white-space: normal; text-align: left; }
  .templates button > svg { width: 100%; height: 110px; background: var(--panel-2); border-radius: 4px; }
  .templates small { color: var(--muted); }
  .status { font: 12px var(--font-mono); color: var(--muted); }
  .align-row button { padding: 4px 6px; }
  .align-row svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; }
  .center { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-width: 0; min-height: 0; }
  #pagebar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; overflow-x: auto; background: var(--panel); border-top: 1px solid var(--line); }
  .pthumb { flex-direction: column; padding: 4px; gap: 2px; background: var(--panel-2); flex: none; }
  .pthumb > svg { display: block; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  .pthumb span { font: 11px var(--font-mono); color: var(--muted); }
  .pthumb.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .pactions { display: flex; gap: 4px; flex: none; }
  .pactions button { font-size: 12px; padding: 4px 8px; }
  #side .icon-row { display: flex; gap: 4px; flex-wrap: wrap; }
  #side .icon-row button { font-size: 12px; padding: 4px 8px; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="brand" href="index.html"><span class="logo">Ds</span><span>Design Joe</span></a>
    <div class="menu"><button data-menu>Fichier ▾</button>
      <div class="menu-list" hidden>
        <button data-act="templates">Nouveau depuis un modèle…</button>
        <button data-act="magicResize">Redimensionner (format magique)…</button>
        <button data-act="newDoc">Nouveau format personnalisé…</button>
        <button data-act="openProject">Ouvrir un projet (.joedesign / .svg)…</button>
        <button data-act="saveProject">Enregistrer le projet (.joedesign)</button>
        <hr>
        <button data-act="exportPNG">Exporter en PNG <span class="kbd">Ctrl+S</span></button>
        <button data-act="exportJPG">Exporter en JPG</button>
        <button data-act="exportSVG">Exporter en SVG (vectoriel)</button>
        <button data-act="exportPDF">Exporter en PDF (vectoriel ou image)</button>
        <button data-act="exportVideo">Exporter en vidéo MP4 / GIF animé</button>
      </div>
    </div>
    <div class="menu"><button data-menu>Édition ▾</button>
      <div class="menu-list" hidden>
        <button data-act="undo">Annuler <span class="kbd">Ctrl+Z</span></button>
        <button data-act="redo">Rétablir <span class="kbd">Ctrl+Y</span></button>
        <hr>
        <button data-act="copy">Copier <span class="kbd">Ctrl+C</span></button>
        <button data-act="paste">Coller <span class="kbd">Ctrl+V</span></button>
        <button data-act="duplicate">Dupliquer <span class="kbd">Ctrl+D</span></button>
        <button data-act="delete">Supprimer <span class="kbd">Suppr</span></button>
        <button data-act="selectAll">Tout sélectionner <span class="kbd">Ctrl+A</span></button>
        <hr>
        <button data-act="group">Grouper <span class="kbd">Ctrl+G</span></button>
        <hr>
        <button data-act="translate">Traduire le design…</button>
        <button data-act="ungroup">Dissocier <span class="kbd">Ctrl+Maj+G</span></button>
      </div>
    </div>
    <div class="menu"><button data-menu>Objet ▾</button>
      <div class="menu-list" hidden>
        <button data-act="front">Premier plan <span class="kbd">Ctrl+Maj+]</span></button>
        <button data-act="forward">Avancer <span class="kbd">Ctrl+]</span></button>
        <button data-act="backward">Reculer <span class="kbd">Ctrl+[</span></button>
        <button data-act="back">Arrière-plan <span class="kbd">Ctrl+Maj+[</span></button>
        <hr>
        <button data-act="flipH">Miroir horizontal</button>
        <button data-act="flipV">Miroir vertical</button>
        <button data-act="lock">Verrouiller / déverrouiller</button>
        <hr>
        <button data-act="library">Éléments (formes, icônes, cadres, graphiques, QR)… <span class="kbd">K</span></button>
        <hr>
        <button data-act="unite">Pathfinder : réunir</button>
        <button data-act="subtract">Pathfinder : soustraire</button>
        <button data-act="intersect">Pathfinder : intersection</button>
        <button data-act="exclude">Pathfinder : exclure</button>
        <button data-act="outline">Vectoriser (convertir en tracé)</button>
        <hr>
        <button data-act="magicAnim">Animer la page</button>
      </div>
    </div>
    <button data-act="undo" id="undoBtn" title="Annuler (Ctrl+Z)">↶</button>
    <button data-act="redo" id="redoBtn" title="Rétablir (Ctrl+Y)">↷</button>
    <span class="spacer"></span>
    <span class="status" id="status"></span>
    <button data-act="zoomOut" title="Zoom arrière">−</button>
    <button data-act="fit" id="zoomLbl" title="Ajuster (Ctrl+0)">100 %</button>
    <button data-act="zoomIn" title="Zoom avant">+</button>
    <button id="themeBtn" class="ghost" title="Basculer thème clair/sombre">Thème</button>
    <button data-act="previewAnim" title="Voir les animations en lecture automatique">✦ Aperçu</button>
    <button data-act="present" title="Présenter en plein écran (F5)">▶ Présenter</button>
    <div class="menu"><button class="primary" data-menu>Exporter ▾</button>
      <div class="menu-list" hidden style="left:auto; right:0">
        <button data-act="exportPNG">PNG</button><button data-act="exportJPG">JPG</button><button data-act="exportSVG">SVG</button><button data-act="exportPDF">PDF</button><button data-act="exportVideo">Vidéo MP4 / GIF animé</button>
      </div>
    </div>
  </div>
  <div class="workspace">
    <nav class="rail" id="rail" aria-label="Outils"></nav>
    <div class="center">
      <main class="stage" id="stage"><svg id="board" xmlns="http://www.w3.org/2000/svg"></svg></main>
      <nav id="pagebar" aria-label="Pages"></nav>
    </div>
    <aside class="side" id="side"></aside>
  </div>
</div>
<div id="toast" hidden></div>
<script src="lib/pdf-lib.min.js"></script>
<script src="lib/jszip.min.js"></script>
<script src="lib/qrcode.js"></script>
<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/svg2pdf.umd.min.js"></script>
<script src="lib/paper-core.min.js"></script>
<script src="lib/mp4-muxer.js"></script>
<script src="lib/gifenc.js"></script>
<script src="js/common.js"></script>
<script src="lib/anthropic-sdk.js"></script>
<script src="js/ai.js"></script>
<script src="js/translate.js"></script>
<script src="lib/transformers.js"></script>
<script src="js/transcribe.js"></script>
<script src="js/speech.js"></script>
<script src="js/design-app.js"></script>
</body>
</html>
