<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda Joe</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#d9861c">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<link rel="stylesheet" href="css/studio.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  .ag { display: grid; grid-template-rows: auto auto 1fr; height: 100%; height: 100dvh; }
  .topbar .logo { background: #1565c0 !important; color: #fff !important; }
  .menu-list hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
  .nav { display: flex; gap: 6px; align-items: center; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .nav h2 { margin: 0 8px; font-size: 18px; text-transform: capitalize; min-width: 150px; }
  .nav .sp { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 6px 10px; background: var(--panel); }
  .seg button.on { background: #1565c0; color: #fff; }
  .main { display: grid; grid-template-columns: 250px 1fr; min-height: 0; }
  .side { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 10px; display: grid; gap: 12px; align-content: start; }
  .side h4 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  .side h4 button { padding: 0 7px; min-width: 0; }
  .cal-it { display: flex; gap: 8px; align-items: center; font-size: 14px; padding: 3px 2px; cursor: pointer; }
  .cal-it input { width: 18px; height: 18px; margin: 0; }
  .cal-it .more { margin-left: auto; border: 0; background: none; padding: 0 4px; min-width: 0; color: var(--muted); cursor: pointer; }
  .mini { font-size: 12px; }
  .mini table { width: 100%; border-collapse: collapse; text-align: center; }
  .mini td { padding: 3px 0; cursor: pointer; border-radius: 50%; }
  .mini td.o { color: var(--muted); opacity: .5; } .mini td.t { background: #1565c0; color: #fff; } .mini td.s { outline: 2px solid #1565c0; }
  .mini .hd { display: flex; justify-content: space-between; align-items: center; font-weight: 600; margin-bottom: 4px; }
  .mini .hd button { padding: 0 6px; min-width: 0; }
  .view { overflow: auto; min-height: 0; background: var(--canvas-bg); position: relative; }
  /* mois */
  .month { display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: auto; grid-auto-rows: minmax(96px, 1fr); min-height: 100%; background: var(--line); gap: 1px; }
  .month .dh { background: var(--panel-2); text-align: center; font-size: 12px; font-weight: 600; padding: 4px 0; color: var(--muted); min-height: 0; }
  .month .day { background: var(--panel); padding: 3px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .month .day.o { background: var(--panel-2); } .month .day .n { font-size: 12px; font-weight: 600; align-self: flex-end; padding: 1px 6px; border-radius: 10px; }
  .month .day.t .n { background: #1565c0; color: #fff; }
  .ev { font-size: 12px; border-radius: 4px; padding: 1px 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; cursor: pointer; flex: none; }
  .ev.ad { font-weight: 600; } .ev.tm { background: transparent !important; color: var(--fg); } .ev.tm::before { content: '●'; margin-right: 4px; color: var(--c); }
  .ev.hol { background: transparent !important; color: #c62828; font-style: italic; } .ev.task { background: transparent !important; color: var(--fg); } .ev.task.done { text-decoration: line-through; color: var(--muted); }
  .month .more { font-size: 11px; color: var(--muted); }
  /* semaine / jour */
  .wk { display: grid; min-width: 100%; }
  .wk .head { display: grid; position: sticky; top: 0; z-index: 3; background: var(--panel); border-bottom: 1px solid var(--line); }
  .wk .head div { text-align: center; padding: 6px 2px; font-size: 13px; border-left: 1px solid var(--line); }
  .wk .head .t b { display: inline-block; background: #1565c0; color: #fff; border-radius: 12px; padding: 0 7px; }
  .wk .alld { display: grid; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 33px; z-index: 3; }
  .wk .alld > div { border-left: 1px solid var(--line); padding: 2px; display: flex; flex-direction: column; gap: 2px; min-height: 22px; min-width: 0; }
  .wk .grid { display: grid; position: relative; }
  .wk .hours div { height: 48px; font-size: 11px; color: var(--muted); text-align: right; padding-right: 4px; transform: translateY(-7px); }
  .wk .col { position: relative; border-left: 1px solid var(--line); background: repeating-linear-gradient(var(--panel), var(--panel) 47px, var(--line) 47px, var(--line) 48px); }
  .wk .col.t { background: repeating-linear-gradient(color-mix(in srgb, #1565c0 6%, var(--panel)), color-mix(in srgb, #1565c0 6%, var(--panel)) 47px, var(--line) 47px, var(--line) 48px); }
  .wk .tev { position: absolute; border-radius: 5px; padding: 2px 4px; font-size: 12px; color: #fff; overflow: hidden; cursor: pointer; box-shadow: 0 0 0 1px var(--panel); line-height: 1.25; }
  .wk .now { position: absolute; left: 0; right: 0; height: 2px; background: #e53935; z-index: 2; }
  /* liste */
  .list { padding: 12px; display: grid; gap: 14px; max-width: 820px; }
  .list h3 { margin: 0 0 4px; font-size: 14px; text-transform: capitalize; color: var(--muted); }
  .list .row-ev { display: grid; grid-template-columns: 90px 1fr; gap: 10px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 8px; cursor: pointer; margin-bottom: 4px; }
  .list .row-ev .h { font-size: 13px; color: var(--muted); } .list .row-ev .w { font-size: 12px; color: var(--muted); }
  /* tâches */
  .tasks { padding: 12px; display: grid; gap: 14px; max-width: 820px; }
  .tasks .add { display: flex; gap: 6px; } .tasks .add input { flex: 1; }
  .tk { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 4px; }
  .tk input[type=checkbox] { width: 22px; height: 22px; margin: 0; accent-color: #1565c0; }
  .tk .ti { cursor: pointer; } .tk .ti small { display: block; color: var(--muted); }
  .tk.done .ti { text-decoration: line-through; color: var(--muted); }
  .tk .late { color: #c62828; } .tk .pri { color: #e65100; font-weight: 700; }
  .tasks h3 { margin: 0 0 4px; font-size: 14px; color: var(--muted); }
  .swatches { display: flex; gap: 6px; flex-wrap: wrap; } .swatches button { width: 26px; height: 26px; min-width: 0; padding: 0; border-radius: 50%; } .swatches button.on { outline: 2px solid var(--fg); outline-offset: 2px; }
  .fab { display: none; }
  #sideBtn { display: none; }
  @media (max-width: 820px) {
    .main { grid-template-columns: 1fr; }
    .side { position: fixed; inset: 52px auto 0 0; width: min(84vw, 300px); z-index: 50; box-shadow: var(--shadow); transform: translateX(-105%); transition: transform .2s; }
    .main.open .side { transform: none; }
    #sideBtn { display: inline-flex; }
    .nav h2 { font-size: 16px; min-width: 0; margin: 0 4px; }
    .month { grid-auto-rows: minmax(64px, 1fr); } .month .ev { font-size: 10px; padding: 0 3px; }
    .fab { display: grid; place-items: center; position: fixed; right: 18px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; border-radius: 50%; font-size: 30px; z-index: 30; box-shadow: var(--shadow); padding: 0; background: #1565c0; color: #fff; border: 0; }
    .topbar .brand span:last-child { display: none; }
  }
</style>
</head>
<body>
<div class="ag">
  <div class="topbar">
    <button id="sideBtn" title="Agendas et calendrier">☰</button>
    <a class="brand" href="index.html"><span class="logo">Ag</span><span>Agenda Joe</span></a>
    <div class="menu">
      <button data-menu>Fichier ▾</button>
      <div class="menu-list" hidden>
        <button data-act="importIcs">Importer un agenda (.ics)…</button>
        <button data-act="exportIcs">Exporter vers Google Agenda / téléphone (.ics)…</button>
        <hr>
        <button data-act="notif">Rappels et notifications…</button>
        <button data-act="print">Imprimer la vue</button>
      </div>
    </div>
    <span class="spacer"></span>
    <input type="search" id="q" placeholder="Rechercher…" aria-label="Rechercher" style="width:min(220px,30vw)">
    <button id="themeBtn" class="ghost" title="Basculer thème clair/sombre">Thème</button>
  </div>
  <div class="nav">
    <button data-act="today">Aujourd'hui</button>
    <button data-act="prev" title="Précédent">◀</button><button data-act="next" title="Suivant">▶</button>
    <h2 id="title"></h2>
    <span class="sp"></span>
    <div class="seg" id="views"><button data-v="day">Jour</button><button data-v="week">Semaine</button><button data-v="month">Mois</button><button data-v="list">Liste</button><button data-v="tasks">Tâches</button></div>
    <button class="primary" data-act="new">＋ Nouveau</button>
  </div>
  <div class="main" id="main">
    <aside class="side" id="side"></aside>
    <section class="view" id="view"></section>
  </div>
</div>
<button class="fab" data-act="new" title="Nouvel événement">＋</button>
<div id="toast" hidden></div>
<script src="js/common.js"></script>
<script src="js/agenda-app.js"></script>
</body>
</html>
