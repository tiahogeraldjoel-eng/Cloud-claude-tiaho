name: Fetch BRVM Stock Data

on:
  schedule:
    - cron: '0,30 8-15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    name: Scrape & publish BRVM prices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Fetch BRVM data
        run: python scripts/fetch_brvm_data.py

      - name: Commit & push data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/brvm_stocks.json
          if git diff --cached --quiet; then
            echo "No price changes - skipping commit"
          else
            git commit -m "data: BRVM prices $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
