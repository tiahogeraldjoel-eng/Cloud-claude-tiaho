name: Fetch BRVM Stock Data

on:
  schedule:
    # Toutes les 30min lundi-vendredi 8h-15h UTC (marché BRVM: 9h-15h30 WAT=UTC+1)
    - cron: '0,30 8-15 * * 1-5'
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'BRVMIntelligence/**'
  workflow_dispatch:

jobs:
  fetch:
    name: Fetch BRVM prices via Playwright
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        run: |
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Fetch BRVM stock prices
        run: node scripts/fetch_brvm_playwright.js

      - name: Commit updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/brvm_stocks.json
          if git diff --cached --quiet; then
            echo "Aucune modification detectee"
          else
            git commit -m "data: cours BRVM mis a jour [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push origin main
            echo "Cours pousses sur main"
          fi
