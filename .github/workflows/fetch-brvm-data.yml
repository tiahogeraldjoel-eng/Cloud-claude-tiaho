name: Fetch BRVM Stock Data

on:
  schedule:
    - cron: '0,30 8-15 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Fetch BRVM data
        run: python scripts/fetch_brvm_data.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/brvm_stocks.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: BRVM prices update"
            git push
          fi
