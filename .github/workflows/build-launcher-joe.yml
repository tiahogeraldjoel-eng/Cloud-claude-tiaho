name: Build Launcher Joe APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'launcher-joe/**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: launcher-joe
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LauncherJoe-debug
          path: launcher-joe/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
