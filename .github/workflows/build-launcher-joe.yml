name: Build Launcher Joe APK

on:
  workflow_dispatch:
  push:
    branches: [ main, claude/setup-launcher-joe-1pDKB ]
    paths: [ 'launcher-joe/**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > launcher-joe/local.properties

      - name: Build APK
        id: build
        working-directory: launcher-joe
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Post error to PR
        if: steps.build.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Strategy 1: grab lines between compileDebugKotlin start and FAILURE
          KOTLIN_ERRORS=$(awk '/compileDebugKotlin/{found=1} found && /^FAILURE:/{exit} found{print}' /tmp/build.log | grep -v "^> Task\|^$" | head -80)
          # Strategy 2: any .kt file path line
          if [ -z "$KOTLIN_ERRORS" ]; then
            KOTLIN_ERRORS=$(grep -E "\.kt:" /tmp/build.log | head -60)
          fi
          # Strategy 3: last 100 lines
          if [ -z "$KOTLIN_ERRORS" ]; then
            KOTLIN_ERRORS=$(tail -100 /tmp/build.log)
          fi
          # Also attach full log line count for debugging
          TOTAL_LINES=$(wc -l < /tmp/build.log)
          gh pr comment 45 --body "## ❌ Build error (log: ${TOTAL_LINES} lines)
\`\`\`
$KOTLIN_ERRORS
\`\`\`"

      - name: Fail build if error
        if: steps.build.outputs.exit_code != '0'
        run: exit 1

      - name: Upload APK
        if: steps.build.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: LauncherJoe-debug
          path: launcher-joe/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
