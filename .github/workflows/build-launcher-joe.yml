name: Build Launcher Joe APK

on:
  workflow_dispatch:
  push:
    branches: [ main, claude/setup-launcher-joe-1pDKB ]
    paths: [ 'launcher-joe/**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Build APK
        working-directory: launcher-joe
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LauncherJoe-debug
          path: launcher-joe/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
