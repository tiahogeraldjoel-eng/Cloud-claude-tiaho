name: Build Launcher Joe APK

on:
  push:
    branches:
      - claude/brvm-stock-analyzer-app-SKqIF
      - main
      - master
    paths:
      - 'launcher-joe/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Type de build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission to gradlew
        run: chmod +x launcher-joe/gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('launcher-joe/**/*.gradle*', 'launcher-joe/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Debug APK
        working-directory: launcher-joe
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}

      - name: Get version info
        id: version
        run: |
          echo "date=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT
          echo "sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mv launcher-joe/app/build/outputs/apk/debug/app-debug.apk \
             launcher-joe/app/build/outputs/apk/debug/LauncherJoe-debug-${{ steps.version.outputs.date }}-${{ steps.version.outputs.sha }}.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LauncherJoe-debug-${{ steps.version.outputs.date }}-${{ steps.version.outputs.sha }}
          path: launcher-joe/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Post APK size
        run: |
          APK=$(find launcher-joe/app/build/outputs/apk/debug -name "*.apk" | head -1)
          SIZE=$(du -sh "$APK" | cut -f1)
          echo "### APK généré avec succès 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Champ | Valeur |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Fichier | $(basename $APK) |" >> $GITHUB_STEP_SUMMARY
          echo "| Taille | $SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ steps.version.outputs.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Date | ${{ steps.version.outputs.date }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Téléchargeable dans l'onglet **Actions → Artifacts**" >> $GITHUB_STEP_SUMMARY
