name: Build BRVM Alerte APK

on:
  push:
    branches:
      - feat/brvm-alerte-compilation
      - main
    paths:
      - 'BRVMAlerte/**'
      - '.github/workflows/build-brvm-alerte.yml'
  pull_request:
    paths:
      - 'BRVMAlerte/**'
      - '.github/workflows/build-brvm-alerte.yml'
  schedule:
    - cron: '0,30 8-15 * * 1-5'
  workflow_dispatch:

jobs:
  fetch-data:
    name: Fetch BRVM Stock Data
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests cloudscraper beautifulsoup4 lxml

      - name: Fetch BRVM data
        run: python scripts/fetch_brvm_data.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/brvm_stocks.json
          git diff --cached --quiet || (git commit -m "data: BRVM prices $(date -u '+%Y-%m-%d %H:%M UTC')" && git push)

  build:
    name: Compile APK Debug
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' \
            '8933bad161af4178b1185d1a37fbf41ea5269c55' \
            'd56f5187479451eabf01fb78af6dfcb131a6481e' \
            '24333f8a63b6825ea9c5514f83c2829b004d1fee' \
            > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '%s\n' \
            '84831b9409646a918e30573bab4c9c91346d8abd' \
            > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: false
          validate-wrappers: false

      - name: Build Debug APK
        working-directory: BRVMAlerte
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"

      - if: failure()
        run: |
          grep "^e: " /tmp/gradle-build.log || true
          grep -E "(FAILED|Exception|Caused by)" /tmp/gradle-build.log | tail -20 || true

      - uses: actions/upload-artifact@v4
        with:
          name: BRVM-Alerte-debug-apk
          path: BRVMAlerte/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
