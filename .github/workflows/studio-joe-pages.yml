# Publie Studio Joe sur GitHub Pages.
# Prérequis : Settings → Pages → Source : « GitHub Actions ». Lancement manuel depuis l'onglet Actions.
name: Studio Joe — GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: studio-joe-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: studio-joe
      - id: deployment
        uses: actions/deploy-pages@v4
