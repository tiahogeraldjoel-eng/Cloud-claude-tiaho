name: Build Coffre-Fort Vault Android

on:
  workflow_dispatch:
  push:
    branches: [ main, claude/vault-app-compilation-k25wje ]
    paths: [ 'coffre-fort-vault-android/**' ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coffre-fort-vault-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compiler l'APK Debug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publier l'artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoffreFortVault-android-debug
          path: coffre-fort-vault-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
