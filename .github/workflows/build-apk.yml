name: Build BRVM Intelligence APK

on:
  push:
    branches: [main]
    paths:
      - 'BRVMIntelligence/**'
      - 'data/brvm_stocks.json'
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('BRVMIntelligence/**/*.gradle*', 'BRVMIntelligence/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build debug APK
        working-directory: BRVMIntelligence
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: brvm-intelligence-debug
          path: BRVMIntelligence/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
