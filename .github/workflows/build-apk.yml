name: Build BRVM Intelligence APK

on:
  push:
    branches: [main]
    paths:
      - 'BRVMIntelligence/**'
  workflow_dispatch:

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('BRVMIntelligence/**/*.gradle*', 'BRVMIntelligence/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Create google-services.json stub for CI
        run: |
          cat > BRVMIntelligence/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "brvm-intelligence-ci",
              "storage_bucket": "brvm-intelligence-ci.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.brvm.intelligence"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "CI_PLACEHOLDER_KEY"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Build debug APK
        working-directory: BRVMIntelligence
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: brvm-intelligence-debug
          path: BRVMIntelligence/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
