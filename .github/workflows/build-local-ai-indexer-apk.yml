name: Build Local AI Indexer APK

on:
  workflow_dispatch:
  push:
    branches: [ main, claude/local-ai-indexer-android-gaao4o ]
    paths: [ 'local-ai-indexer/**', '.github/workflows/build-local-ai-indexer-apk.yml' ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK components (platform, build-tools, NDK, CMake)
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Build debug APK
        working-directory: local-ai-indexer
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalAIIndexer-debug
          path: local-ai-indexer/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
