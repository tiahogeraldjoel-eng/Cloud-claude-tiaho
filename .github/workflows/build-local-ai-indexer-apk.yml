name: Build Local AI Indexer APK

on:
  workflow_dispatch:
  push:
    branches: [ main, claude/local-ai-indexer-android-gaao4o ]
    paths: [ 'local-ai-indexer/**', '.github/workflows/build-local-ai-indexer-apk.yml' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK components (platform, build-tools, NDK, CMake)
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Build debug APK
        working-directory: local-ai-indexer
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: LocalAIIndexer-debug
          path: local-ai-indexer/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Also publish as a rolling GitHub Release asset: a plain static download
      # link, more reliable than the Actions artifact UI (no login-gated JS
      # fetch, no expiry) — easier to grab directly from a phone browser.
      - name: Publish APK to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: local-ai-indexer-debug
          name: Local AI Indexer (debug build)
          body: |
            APK debug généré automatiquement depuis le dernier build réussi
            de la branche `${{ github.ref_name }}` (commit ${{ github.sha }}).
            Non signé pour la Play Store — build de test uniquement.
          prerelease: true
          files: local-ai-indexer/app/build/outputs/apk/debug/app-debug.apk
