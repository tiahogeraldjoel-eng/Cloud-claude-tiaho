name: BRVM Pre-Open Signal Alert

on:
  schedule:
    - cron: '35 9 * * 1-5'
  workflow_dispatch:

jobs:
  alert:
    runs-on: ubuntu-latest
    name: Signaux pre-ouverture BRVM Telegram

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run BRVM Signal Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUDGET_FCFA: '75000'
          # URL du Cloudflare Worker (source primaire — Cloudflare edge, pas de geo-blocage)
          # Configurer dans GitHub → Settings → Variables → Actions → BRVM_WORKER_URL
          BRVM_WORKER_URL: ${{ vars.BRVM_WORKER_URL }}
        run: node brvm-prices/scripts/signal-alert.js
