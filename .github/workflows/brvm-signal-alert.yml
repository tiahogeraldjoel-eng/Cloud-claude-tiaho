name: BRVM Pre-Open Signal Alert

on:
  workflow_dispatch:

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Signaux pre-ouverture BRVM Telegram

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run BRVM Signal Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUDGET_FCFA: '75000'
          BRVM_WORKER_URL: ${{ vars.BRVM_WORKER_URL }}
        run: node brvm-prices/scripts/signal-alert.js
