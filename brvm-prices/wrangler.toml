name = "brvm-prices"
main = "src/index.js"
compatibility_date = "2024-01-01"

[vars]
CACHE_TTL = "3600"

# Cron pré-ouverture BRVM : 9h35 GMT, lundi-vendredi
[triggers]
crons = ["35 9 * * 1-5"]

# Secrets à configurer dans le dashboard Cloudflare (jamais en clair ici) :
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put TELEGRAM_CHAT_ID
