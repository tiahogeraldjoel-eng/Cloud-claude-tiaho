name = "brvm-prices"
main = "src/index.js"
compatibility_date = "2024-01-01"

[vars]
CACHE_TTL = "3600"
BUDGET_FCFA = "75000"

# Cron post-fixing BRVM : 10h15 GMT, lundi-vendredi
# (le fixing BRVM se termine ~10h00-10h05, les vrais volumes sont publiés ensuite)
[triggers]
crons = ["15 10 * * 1-5"]

# Secrets à configurer dans le dashboard Cloudflare (jamais en clair ici) :
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put TELEGRAM_CHAT_ID
